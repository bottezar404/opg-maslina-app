<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#556b2f">
  <title>OPG Maslina</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Prijava -->
  <section id="login-view" class="login hidden">
    <form id="login-form" class="card login-card">
      <img src="icon.svg" alt="" class="logo">
      <h1>OPG Maslina</h1>
      <p class="muted">Prijavite se za nastavak</p>
      <label>E-mail<input name="email" type="email" autocomplete="username" required autofocus></label>
      <label>Lozinka<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error"></p>
      <button type="submit" class="btn primary">Prijava</button>
    </form>
  </section>

  <!-- Aplikacija -->
  <div id="app-view" class="hidden">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Izbornik">☰</button>
      <strong class="brand">🫒 OPG Maslina</strong>
      <select id="year-select" aria-label="Godina"></select>
    </header>
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"></main>
  </div>

  <dialog id="dialog"><form id="dialog-form" method="dialog"></form></dialog>
  <div id="toast" class="toast"></div>
  <script src="supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
